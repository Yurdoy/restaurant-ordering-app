<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mobile-first restaurant ordering app built with vanilla JavaScript"
    />
    <title>Jimmy’s Diner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Smythe&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-text">
        <h1 class="header-title">Jimmy’s Diner</h1>
        <p class="header-description">The best burgers and pizzas in town.</p>
      </div>
    </header>
    <main class="main">
      <section class="menu"></section>
      <section class="order hidden">
        <h2 class="order__title">Your order</h2>
        <ul class="order__list"></ul>
        <div class="order__discount hidden">
          <p class="order__discount-title">Meal deal</p>
          <p class="order__discount-price">$0</p>
        </div>
        <div class="order__total">
          <p class="order__total-price-title">Total price:</p>
          <p class="order__total-price">$0</p>
        </div>
        <button class="order__complete-button" data-complete="">
          Complete order
        </button>
      </section>
      <section class="modal hidden">
        <h2 class="modal__title">Enter card details</h2>
        <form class="modal__form">
          <label class="visually-hidden" for="name">Name</label>
          <input
            type="text"
            id="name"
            class="modal__input"
            name="name"
            placeholder="Enter your name"
            autocomplete="cc-name"
            required
          />
          <label class="visually-hidden" for="card">Card number</label>
          <input
            type="text"
            inputmode="numeric"
            id="card"
            class="modal__input"
            name="card"
            placeholder="Enter card number"
            autocomplete="cc-number"
            pattern="\d{13,19}"
            maxlength="19"
            title="13 to 19 digits"
            required
          />
          <label class="visually-hidden" for="cvv">CVV</label>
          <input
            type="text"
            inputmode="numeric"
            id="cvv"
            class="modal__input"
            name="cvv"
            placeholder="Enter CVV"
            autocomplete="cc-csc"
            pattern="\d{3,4}"
            maxlength="4"
            title="3 to 4 digits"
            required
          />
          <button class="modal__btn" type="submit">Pay</button>
        </form>
      </section>
      <section class="complete-order hidden" role="status"></section>
    </main>
    <script src="index.js" type="module"></script>
  </body>
</html>
