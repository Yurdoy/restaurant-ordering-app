<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jimmy’s Diner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Smythe&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-text">
        <h1 class="header-title">Jimmy’s Diner</h1>
        <p class="header-description">The best burgers and pizzas in town.</p>
      </div>
    </header>
    <main class="main">
      <section class="menu"></section>
      <section class="order">
        <h2 class="order__title">Your order</h2>
        <ul class="order__list">
          <li class="order__item">
            <p class="order__name">Pizza</p>
            <button class="order__remove">remove</button>
            <p class="order__price">$14</p>
          </li>
          <li class="order__item">
            <p class="order__name">Beer</p>
            <button class="order__remove">remove</button>
            <p class="order__price">$12</p>
          </li>
        </ul>
        <div class="order__total">
          <p class="order__total-price-title">Total price:</p>
          <p class="order__total-price">$26</p>
        </div>
        <button class="order__complete-button">Complete order</button>
      </section>
    </main>
    <script src="index.js" type="module"></script>
  </body>
</html>
